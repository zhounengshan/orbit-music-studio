<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Orbit Music — 搜索、播放、收藏、下载与同步歌词。" />
  <title>Orbit Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=1" />
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="icon-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m14.8 9.2-2 5.6-5.6 2 2-5.6 5.6-2Z"/></symbol>
    <symbol id="icon-library" viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 6v14M19 5l2 14"/></symbol>
    <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20.8 5.8a5.2 5.2 0 0 0-7.4 0L12 7.2l-1.4-1.4a5.2 5.2 0 0 0-7.4 7.4L12 22l8.8-8.8a5.2 5.2 0 0 0 0-7.4Z"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path class="icon-fill" d="m8 5 11 7-11 7V5Z"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
    <symbol id="icon-prev" viewBox="0 0 24 24"><path d="M6 5v14m12-13-9 6 9 6V6Z"/></symbol>
    <symbol id="icon-next" viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6V6Z"/></symbol>
    <symbol id="icon-shuffle" viewBox="0 0 24 24"><path d="M4 7h3c5 0 5 10 10 10h3m-3-3 3 3-3 3M4 17h3c2.2 0 3.4-1.9 4.5-4M16 4l4 3-4 3"/></symbol>
    <symbol id="icon-repeat" viewBox="0 0 24 24"><path d="m17 2 3 3-3 3M20 5H8a4 4 0 0 0-4 4v1m3 12-3-3 3-3M4 19h12a4 4 0 0 0 4-4v-1"/></symbol>
    <symbol id="icon-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="icon-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Zm4.5 4.5a4 4 0 0 1 0 5m2.5-8a8 8 0 0 1 0 11"/></symbol>
    <symbol id="icon-lyrics" viewBox="0 0 24 24"><path d="M5 6h14M5 10h10M5 14h14M5 18h8"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <a class="brand" href="#" aria-label="Orbit Music 首页">
        <svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="7"/><ellipse cx="17" cy="17" rx="15" ry="6.5" transform="rotate(-24 17 17)"/></svg>
        <span>Orbit</span>
      </a>

      <nav class="nav-list">
        <button class="nav-item active" data-view="discover"><svg class="icon"><use href="#icon-compass"/></svg><span>搜索音乐</span></button>
        <button class="nav-item" data-view="library"><svg class="icon"><use href="#icon-library"/></svg><span>我的曲库</span><b id="libraryCount">0</b></button>
        <button class="nav-item" data-view="favorites"><svg class="icon"><use href="#icon-heart"/></svg><span>我的收藏</span><b id="favoriteCount">0</b></button>
        <button class="nav-item" data-view="downloads"><svg class="icon"><use href="#icon-download"/></svg><span>下载记录</span><b id="downloadCount">0</b></button>
      </nav>

      <section class="playlist-section">
        <div class="playlist-heading"><span>歌单</span><button id="createPlaylistBtn" aria-label="新建歌单"><svg class="icon"><use href="#icon-plus"/></svg></button></div>
        <div class="playlist-nav" id="playlistNav"></div>
      </section>
      <p class="privacy-note">收藏和歌单保存在当前浏览器</p>
    </aside>
    <button class="sidebar-scrim" id="sidebarScrim" aria-label="关闭菜单"></button>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="打开菜单" aria-controls="sidebar" aria-expanded="false"><svg class="icon"><use href="#icon-menu"/></svg></button>
        <label class="search-box">
          <svg class="icon"><use href="#icon-search"/></svg>
          <input id="searchInput" type="search" aria-label="搜索歌曲、艺人或专辑" placeholder="搜索歌曲、艺人或专辑" autocomplete="off" />
          <kbd>⌘ K</kbd>
          <button type="button" id="searchBtn">搜索</button>
        </label>
        <div class="source-switch">
          <label for="sourceSelect">来源</label>
          <select id="sourceSelect">
            <option value="all">全部</option>
            <option value="wyy">网易云</option>
            <option value="kuwo">酷我</option>
          </select>
        </div>
        <button class="import-button" id="uploadBtn"><svg class="icon"><use href="#icon-plus"/></svg><span>导入</span></button>
        <input type="file" id="fileInput" accept="audio/*" multiple hidden />
      </header>

      <div class="content">
        <section class="music-view">
          <div class="section-head">
            <div><h1 id="sectionTitle">搜索音乐</h1><p id="sectionSubtitle">输入歌曲、艺人或专辑名称，结果会显示在这里。</p></div>
            <div class="view-actions"><button id="sortBtn">最近添加</button><button id="manageBtn">管理曲库</button></div>
          </div>
          <div class="table-head" aria-hidden="true"><span></span><span>歌曲</span><span>专辑</span><span>音质</span><span>时长</span><span></span></div>
          <div class="track-table" id="trackTable"></div>
          <div class="empty-state" id="emptyState">
            <div class="empty-mark"><svg class="icon"><use href="#icon-search"/></svg></div>
            <h2>从一首歌开始</h2>
            <p>搜索想听的歌曲，或从设备导入音频。</p>
            <button onclick="document.querySelector('#searchInput').focus()">开始搜索</button>
          </div>
        </section>
      </div>
    </main>

    <aside class="lyrics-panel" id="lyricsPanel" aria-label="同步歌词" aria-hidden="true" inert>
      <button class="close-panel" id="closeLyrics" aria-label="关闭歌词"><svg class="icon"><use href="#icon-close"/></svg></button>
      <div class="lyrics-top">
        <div class="cover-large" id="coverLarge"><span>Orbit</span></div>
        <h2 id="lyricTitle">尚未播放</h2>
        <p id="lyricArtist">搜索一首歌开始聆听</p>
      </div>
      <div class="lyrics-scroll" id="lyricsScroll"><p class="lyric-line active">歌词会随着播放自动滚动</p></div>
      <button class="lyric-mode" id="lyricModeBtn">译文 · 开</button>
    </aside>
  </div>

  <footer class="player" id="player">
    <div class="now-track">
      <div class="mini-cover" id="miniCover"><span>O</span></div>
      <div class="now-copy"><strong id="playerTitle">尚未播放</strong><span id="playerArtist">搜索一首歌开始聆听</span></div>
      <button class="icon-btn favorite-player" id="playerFavorite" aria-label="收藏当前歌曲"><svg class="icon"><use href="#icon-heart"/></svg></button>
    </div>
    <div class="transport">
      <div class="transport-buttons">
        <button id="shuffleBtn" aria-label="随机播放"><svg class="icon"><use href="#icon-shuffle"/></svg></button>
        <button id="prevBtn" aria-label="上一首"><svg class="icon"><use href="#icon-prev"/></svg></button>
        <button class="play-main" id="mainPlayBtn" aria-label="播放"><svg class="icon"><use href="#icon-play"/></svg></button>
        <button id="nextBtn" aria-label="下一首"><svg class="icon"><use href="#icon-next"/></svg></button>
        <button id="repeatBtn" aria-label="循环播放"><svg class="icon"><use href="#icon-repeat"/></svg></button>
      </div>
      <div class="progress-row"><span id="currentTime">00:00</span><input id="progress" type="range" min="0" max="100" value="0" aria-label="播放进度" /><span id="duration">00:00</span></div>
    </div>
    <div class="player-tools">
      <button id="lyricsBtn" class="lyrics-button" aria-label="查看歌词" aria-controls="lyricsPanel" aria-expanded="false"><svg class="icon"><use href="#icon-lyrics"/></svg><span>歌词</span><b class="lyrics-glyph" aria-hidden="true">词</b></button>
      <button id="queueBtn" aria-label="播放队列"><svg class="icon"><use href="#icon-list"/></svg></button>
      <svg class="icon volume-icon"><use href="#icon-volume"/></svg><input id="volume" type="range" min="0" max="100" value="75" aria-label="音量" />
      <button id="downloadCurrent" aria-label="下载当前歌曲"><svg class="icon"><use href="#icon-download"/></svg></button>
    </div>
  </footer>

  <div class="toast" id="toast" role="status"></div>
  <div class="modal" id="playlistModal" role="dialog" aria-modal="true" aria-labelledby="playlistModalTitle" hidden>
    <div class="modal-card">
      <button class="modal-close" data-close-modal aria-label="关闭"><svg class="icon"><use href="#icon-close"/></svg></button>
      <h2 id="playlistModalTitle">新建歌单</h2>
      <label>歌单名称<input id="playlistName" maxlength="18" placeholder="例如：深夜通勤" /></label>
      <button class="primary-btn" id="savePlaylistBtn">创建歌单</button>
    </div>
  </div>
  <audio id="audio" preload="metadata"></audio>
  <script src="./app.js?v=1"></script>
</body>
</html>
